<rect class="track" x="90" y="247" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="247" width="380" height="16" rx="4" fill="#19a979" style="transform:scaleX(0.2739)"/>
<text class="value" x="591" y="259" text-anchor="end">1.89 s</text>
<text class="value" x="695" y="259" text-anchor="end">3.7×</text>
<text class="value" x="800" y="259" text-anchor="end">1.9 s</text>
