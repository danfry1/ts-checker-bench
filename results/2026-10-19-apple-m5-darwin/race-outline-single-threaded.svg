</g>
<text class="foot" x="16" y="296">Same diagnostics as tsgo, clean and with planted errors: tsc-ts, bun.</text>
<text class="foot" x="16" y="314">Different: tsc-rs +1 / −0 (matches its upstream build) · tsrs +1 / −0 (matches its upstream build).</text>
<text class="foot" x="16" y="332">Medians. "vs tsgo": tsgo's wall time divided by the checker's. CPU time: user + system, across all threads. Peak memory: maximum resident set size.</text>
<text class="foot" x="16" y="350">+n / −m: diagnostics only in the checker / only in tsgo.</text>
</svg>
