</g>
<g class="l2">
<text class="name" x="16" y="199">bun</text>
<rect class="track" x="90" y="187" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="187" width="380" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.4246)"/>
<text class="value" x="591" y="199" text-anchor="end">2.93 s</text>
<text class="value" x="695" y="199" text-anchor="end">2.4×</text>
<text class="value" x="800" y="199" text-anchor="end">2.9 s</text>
<text class="value" x="904" y="199" text-anchor="end">1.0 GiB</text>
</g>
<g class="l3">
<text class="name" x="16" y="229">tsc-rs</text>
<rect class="track" x="90" y="217" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="217" width="380" height="16" rx="4" fill="#e8743b" style="transform:scaleX(0.4058)"/>
<text class="value" x="591" y="229" text-anchor="end">2.80 s</text>
<text class="value" x="695" y="229" text-anchor="end">2.5×</text>
<text class="value" x="800" y="229" text-anchor="end">2.8 s</text>
<text class="value" x="904" y="229" text-anchor="end">1.3 GiB</text>
</g>
<g class="l4">
