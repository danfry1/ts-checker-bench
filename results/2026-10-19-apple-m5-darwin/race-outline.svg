<text class="value" x="695" y="199" text-anchor="end">3.7×</text>
<text class="value" x="800" y="199" text-anchor="end">9.4 s</text>
<text class="value" x="904" y="199" text-anchor="end">2.3 GiB</text>
</g>
<g class="l3">
<text class="name" x="16" y="229">bun</text>
<rect class="track" x="90" y="217" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="217" width="380" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.2680)"/>
<text class="value" x="591" y="229" text-anchor="end">1.04 s</text>
<text class="value" x="695" y="229" text-anchor="end">3.7×</text>
<text class="value" x="800" y="229" text-anchor="end">8.1 s</text>
