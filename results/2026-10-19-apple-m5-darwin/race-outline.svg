<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 366" width="920" height="366" role="img" aria-labelledby="t d">
<title id="t">Outline, default threading: wall time of one full type check</title>
<desc id="d">2,315 project files · tsgo creates 0.6 M types and 5.8 M instantiations. Shipped defaults, no thread flags: tsgo and tsc-rs 4 checkers; tsc-ts, tsrs and bun one per core (10). Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs. tsgo: wall time 3.88 s, vs tsgo 1.0×, CPU time 16.9 s, peak memory 3.1 GiB; tsc-rs: wall time 1.57 s, vs tsgo 2.5×, CPU time 4.8 s, peak memory 1.8 GiB; tsc-ts: wall time 1.04 s, vs tsgo 3.7×, CPU time 9.4 s, peak memory 2.3 GiB; bun: wall time 1.04 s, vs tsgo 3.7×, CPU time 8.1 s, peak memory 1.0 GiB; tsrs: wall time 0.69 s, vs tsgo 5.6×, CPU time 5.7 s, peak memory 1.0 GiB.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.bg{fill:#ffffff;stroke:#d1d9e0}.track{fill:#eff2f5}
.title{font-size:16px;font-weight:600}.sub,.foot{font-size:12px;fill:#59636e}
.value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{transform-box:fill-box;transform-origin:left center}.bar,.value{animation-duration:6.38s;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes b0{0%{transform:scaleX(0)}60.82%,100%{transform:scaleX(1.0000)}}
@keyframes v0{0%,60.81%{opacity:0}60.82%,100%{opacity:1}}
.l0 .bar{animation-name:b0}.l0 .value{animation-name:v0}
@keyframes b1{0%{transform:scaleX(0)}24.61%,100%{transform:scaleX(0.4046)}}
@keyframes v1{0%,24.60%{opacity:0}24.61%,100%{opacity:1}}
.l1 .bar{animation-name:b1}.l1 .value{animation-name:v1}
@keyframes b2{0%{transform:scaleX(0)}16.30%,100%{transform:scaleX(0.2680)}}
@keyframes v2{0%,16.29%{opacity:0}16.30%,100%{opacity:1}}
.l2 .bar{animation-name:b2}.l2 .value{animation-name:v2}
@keyframes b3{0%{transform:scaleX(0)}16.30%,100%{transform:scaleX(0.2680)}}
@keyframes v3{0%,16.29%{opacity:0}16.30%,100%{opacity:1}}
.l3 .bar{animation-name:b3}.l3 .value{animation-name:v3}
@keyframes b4{0%{transform:scaleX(0)}10.82%,100%{transform:scaleX(0.1778)}}
@keyframes v4{0%,10.81%{opacity:0}10.82%,100%{opacity:1}}
.l4 .bar{animation-name:b4}.l4 .value{animation-name:v4}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#3d444d}.track{fill:#21262d}text{fill:#e6edf3}.sub,.foot{fill:#9198a1}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}
</style>
<rect class="bg" x="0.5" y="0.5" width="919" height="365" rx="6"/>
<text class="title" x="16" y="28">Outline, default threading</text>
<text class="sub" x="16" y="48">2,315 project files · tsgo creates 0.6 M types and 5.8 M instantiations</text>
<text class="sub" x="16" y="66">Shipped defaults, no thread flags: tsgo and tsc-rs 4 checkers; tsc-ts, tsrs and bun one per core (10)</text>
<text class="sub" x="16" y="84">Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs</text>
<text class="sub" x="591" y="108" text-anchor="end">wall time</text>
<text class="sub" x="695" y="108" text-anchor="end">vs tsgo</text>
<text class="sub" x="800" y="108" text-anchor="end">CPU time</text>
<text class="sub" x="904" y="108" text-anchor="end">peak memory</text>
