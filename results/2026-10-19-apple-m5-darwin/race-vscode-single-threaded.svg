<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 348" width="920" height="348" role="img" aria-labelledby="t d">
<title id="t">VS Code, single-threaded: wall time of one full type check</title>
<desc id="d">10,645 project files · tsgo creates 3.3 M types and 4.2 M instantiations. Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs. tsgo: wall time 18.98 s, vs tsgo 1.0×, CPU time 25.5 s, peak memory 8.0 GiB; tsc-ts: wall time 16.06 s, vs tsgo 1.2×, CPU time 15.6 s, peak memory 6.0 GiB; bun: wall time 11.33 s, vs tsgo 1.7×, CPU time 11.3 s, peak memory 1.8 GiB; tsc-rs: wall time 9.33 s, vs tsgo 2.0×, CPU time 9.2 s, peak memory 5.5 GiB; tsrs: wall time 5.95 s, vs tsgo 3.2×, CPU time 6.1 s, peak memory 1.9 GiB.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.bg{fill:#ffffff;stroke:#d1d9e0}.track{fill:#eff2f5}
.title{font-size:16px;font-weight:600}.sub,.foot{font-size:12px;fill:#59636e}
.value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{transform-box:fill-box;transform-origin:left center}.bar,.value{animation-duration:21.48s;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes b0{0%{transform:scaleX(0)}88.36%,100%{transform:scaleX(1.0000)}}
@keyframes v0{0%,88.35%{opacity:0}88.36%,100%{opacity:1}}
.l0 .bar{animation-name:b0}.l0 .value{animation-name:v0}
@keyframes b1{0%{transform:scaleX(0)}74.77%,100%{transform:scaleX(0.8462)}}
@keyframes v1{0%,74.76%{opacity:0}74.77%,100%{opacity:1}}
.l1 .bar{animation-name:b1}.l1 .value{animation-name:v1}
@keyframes b2{0%{transform:scaleX(0)}52.75%,100%{transform:scaleX(0.5969)}}
@keyframes v2{0%,52.74%{opacity:0}52.75%,100%{opacity:1}}
.l2 .bar{animation-name:b2}.l2 .value{animation-name:v2}
@keyframes b3{0%{transform:scaleX(0)}43.44%,100%{transform:scaleX(0.4916)}}
@keyframes v3{0%,43.43%{opacity:0}43.44%,100%{opacity:1}}
.l3 .bar{animation-name:b3}.l3 .value{animation-name:v3}
@keyframes b4{0%{transform:scaleX(0)}27.70%,100%{transform:scaleX(0.3135)}}
@keyframes v4{0%,27.69%{opacity:0}27.70%,100%{opacity:1}}
.l4 .bar{animation-name:b4}.l4 .value{animation-name:v4}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#3d444d}.track{fill:#21262d}text{fill:#e6edf3}.sub,.foot{fill:#9198a1}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}
</style>
<rect class="bg" x="0.5" y="0.5" width="919" height="347" rx="6"/>
<text class="title" x="16" y="28">VS Code, single-threaded</text>
<text class="sub" x="16" y="48">10,645 project files · tsgo creates 3.3 M types and 4.2 M instantiations</text>
<text class="sub" x="16" y="66">Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs</text>
<text class="sub" x="591" y="90" text-anchor="end">wall time</text>
<text class="sub" x="695" y="90" text-anchor="end">vs tsgo</text>
<text class="sub" x="800" y="90" text-anchor="end">CPU time</text>
<text class="sub" x="904" y="90" text-anchor="end">peak memory</text>
<g class="l0">
<text class="name" x="16" y="121">tsgo</text>
<rect class="track" x="90" y="109" width="380" height="16" rx="4"/>
