<text class="value" x="800" y="151" text-anchor="end">15.6 s</text>
<text class="value" x="904" y="151" text-anchor="end">6.0 GiB</text>
</g>
<g class="l2">
<text class="name" x="16" y="181">bun</text>
<rect class="track" x="90" y="169" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="169" width="380" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.5969)"/>
<text class="value" x="591" y="181" text-anchor="end">11.33 s</text>
<text class="value" x="695" y="181" text-anchor="end">1.7×</text>
<text class="value" x="800" y="181" text-anchor="end">11.3 s</text>
<text class="value" x="904" y="181" text-anchor="end">1.8 GiB</text>
</g>
<g class="l3">
<text class="name" x="16" y="211">tsc-rs</text>
<rect class="track" x="90" y="199" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="199" width="380" height="16" rx="4" fill="#e8743b" style="transform:scaleX(0.4916)"/>
<text class="value" x="591" y="211" text-anchor="end">9.33 s</text>
<text class="value" x="695" y="211" text-anchor="end">2.0×</text>
<text class="value" x="800" y="211" text-anchor="end">9.2 s</text>
<text class="value" x="904" y="211" text-anchor="end">5.5 GiB</text>
</g>
<g class="l4">
<text class="name" x="16" y="241">tsrs</text>
<rect class="track" x="90" y="229" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="229" width="380" height="16" rx="4" fill="#19a979" style="transform:scaleX(0.3135)"/>
<text class="value" x="591" y="241" text-anchor="end">5.95 s</text>
<text class="value" x="695" y="241" text-anchor="end">3.2×</text>
