<rect class="track" x="90" y="217" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="217" width="380" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.2996)"/>
<text class="value" x="591" y="229" text-anchor="end">2.13 s</text>
<text class="value" x="695" y="229" text-anchor="end">3.3×</text>
<text class="value" x="800" y="229" text-anchor="end">19.2 s</text>
