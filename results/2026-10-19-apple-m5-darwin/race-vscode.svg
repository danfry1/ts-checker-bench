<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 366" width="920" height="366" role="img" aria-labelledby="t d">
<title id="t">VS Code, default threading: wall time of one full type check</title>
<desc id="d">10,645 project files · tsgo creates 3.3 M types and 4.2 M instantiations. Shipped defaults, no thread flags: tsgo and tsc-rs 4 checkers; tsc-ts, tsrs and bun one per core (10). Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs. tsgo: wall time 7.11 s, vs tsgo 1.0×, CPU time 36.9 s, peak memory 8.2 GiB; tsc-ts: wall time 3.27 s, vs tsgo 2.2×, CPU time 30.3 s, peak memory 6.9 GiB; tsc-rs: wall time 2.94 s, vs tsgo 2.4×, CPU time 12.2 s, peak memory 6.1 GiB; bun: wall time 2.13 s, vs tsgo 3.3×, CPU time 19.2 s, peak memory 2.2 GiB; tsrs: wall time 1.22 s, vs tsgo 5.8×, CPU time 11.2 s, peak memory 2.3 GiB.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.bg{fill:#ffffff;stroke:#d1d9e0}.track{fill:#eff2f5}
.title{font-size:16px;font-weight:600}.sub,.foot{font-size:12px;fill:#59636e}
.value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{transform-box:fill-box;transform-origin:left center}.bar,.value{animation-duration:9.61s;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes b0{0%{transform:scaleX(0)}73.99%,100%{transform:scaleX(1.0000)}}
@keyframes v0{0%,73.98%{opacity:0}73.99%,100%{opacity:1}}
.l0 .bar{animation-name:b0}.l0 .value{animation-name:v0}
@keyframes b1{0%{transform:scaleX(0)}34.03%,100%{transform:scaleX(0.4599)}}
@keyframes v1{0%,34.02%{opacity:0}34.03%,100%{opacity:1}}
.l1 .bar{animation-name:b1}.l1 .value{animation-name:v1}
@keyframes b2{0%{transform:scaleX(0)}30.59%,100%{transform:scaleX(0.4135)}}
@keyframes v2{0%,30.58%{opacity:0}30.59%,100%{opacity:1}}
.l2 .bar{animation-name:b2}.l2 .value{animation-name:v2}
@keyframes b3{0%{transform:scaleX(0)}22.16%,100%{transform:scaleX(0.2996)}}
@keyframes v3{0%,22.15%{opacity:0}22.16%,100%{opacity:1}}
.l3 .bar{animation-name:b3}.l3 .value{animation-name:v3}
@keyframes b4{0%{transform:scaleX(0)}12.70%,100%{transform:scaleX(0.1716)}}
@keyframes v4{0%,12.69%{opacity:0}12.70%,100%{opacity:1}}
.l4 .bar{animation-name:b4}.l4 .value{animation-name:v4}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#3d444d}.track{fill:#21262d}text{fill:#e6edf3}.sub,.foot{fill:#9198a1}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}
</style>
<rect class="bg" x="0.5" y="0.5" width="919" height="365" rx="6"/>
<text class="title" x="16" y="28">VS Code, default threading</text>
<text class="sub" x="16" y="48">10,645 project files · tsgo creates 3.3 M types and 4.2 M instantiations</text>
<text class="sub" x="16" y="66">Shipped defaults, no thread flags: tsgo and tsc-rs 4 checkers; tsc-ts, tsrs and bun one per core (10)</text>
<text class="sub" x="16" y="84">Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs</text>
<text class="sub" x="591" y="108" text-anchor="end">wall time</text>
<text class="sub" x="695" y="108" text-anchor="end">vs tsgo</text>
