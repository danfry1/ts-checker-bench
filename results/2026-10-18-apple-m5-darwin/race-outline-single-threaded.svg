<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" width="880" height="348" role="img" aria-labelledby="t d">
<title id="t">Outline, single-threaded: wall time of one full type check</title>
<desc id="d">2,315 project files · tsgo creates 0.6 M types and 5.8 M instantiations. Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs. tsgo: wall 7.99 s, vs tsgo 1.0×, CPU 9.6 s, peak memory 2.3 GiB; tsc-ts: wall 3.50 s, vs tsgo 2.3×, CPU 3.5 s, peak memory 1.4 GiB; bun: wall 3.31 s, vs tsgo 2.4×, CPU 3.3 s, peak memory 1.0 GiB; tsc-rs: wall 3.23 s, vs tsgo 2.5×, CPU 3.2 s, peak memory 1.3 GiB; tsrs: wall 2.16 s, vs tsgo 3.7×, CPU 2.2 s, peak memory 0.6 GiB.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.bg{fill:#ffffff;stroke:#d1d9e0}.track{fill:#eff2f5}
.title{font-size:16px;font-weight:600}.sub,.foot{font-size:12px;fill:#59636e}
.value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{transform-box:fill-box;transform-origin:left center}.bar,.value{animation-duration:10.49s;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes b0{0%{transform:scaleX(0)}76.17%,100%{transform:scaleX(1.0000)}}
@keyframes v0{0%,76.16%{opacity:0}76.17%,100%{opacity:1}}
.l0 .bar{animation-name:b0}.l0 .value{animation-name:v0}
@keyframes b1{0%{transform:scaleX(0)}33.37%,100%{transform:scaleX(0.4380)}}
@keyframes v1{0%,33.36%{opacity:0}33.37%,100%{opacity:1}}
.l1 .bar{animation-name:b1}.l1 .value{animation-name:v1}
@keyframes b2{0%{transform:scaleX(0)}31.55%,100%{transform:scaleX(0.4143)}}
@keyframes v2{0%,31.54%{opacity:0}31.55%,100%{opacity:1}}
.l2 .bar{animation-name:b2}.l2 .value{animation-name:v2}
@keyframes b3{0%{transform:scaleX(0)}30.79%,100%{transform:scaleX(0.4043)}}
@keyframes v3{0%,30.78%{opacity:0}30.79%,100%{opacity:1}}
.l3 .bar{animation-name:b3}.l3 .value{animation-name:v3}
@keyframes b4{0%{transform:scaleX(0)}20.59%,100%{transform:scaleX(0.2703)}}
@keyframes v4{0%,20.58%{opacity:0}20.59%,100%{opacity:1}}
.l4 .bar{animation-name:b4}.l4 .value{animation-name:v4}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#3d444d}.track{fill:#21262d}text{fill:#e6edf3}.sub,.foot{fill:#9198a1}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}
</style>
<rect class="bg" x="0.5" y="0.5" width="879" height="347" rx="6"/>
<text class="title" x="16" y="28">Outline, single-threaded</text>
<text class="sub" x="16" y="48">2,315 project files · tsgo creates 0.6 M types and 5.8 M instantiations</text>
<text class="sub" x="16" y="66">Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs</text>
<text class="sub" x="603" y="90" text-anchor="end">wall</text>
<text class="sub" x="690" y="90" text-anchor="end">vs tsgo</text>
<text class="sub" x="777" y="90" text-anchor="end">CPU</text>
<text class="sub" x="864" y="90" text-anchor="end">peak memory</text>
<g class="l0">
<text class="name" x="16" y="121">tsgo</text>
<rect class="track" x="90" y="109" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="109" width="410" height="16" rx="4" fill="#8a8f98" style="transform:scaleX(1.0000)"/>
<text class="value" x="603" y="121" text-anchor="end">7.99 s</text>
<text class="value" x="690" y="121" text-anchor="end">1.0×</text>
<text class="value" x="777" y="121" text-anchor="end">9.6 s</text>
<text class="value" x="864" y="121" text-anchor="end">2.3 GiB</text>
</g>
<g class="l1">
<text class="name" x="16" y="151">tsc-ts</text>
<rect class="track" x="90" y="139" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="139" width="410" height="16" rx="4" fill="#3178c6" style="transform:scaleX(0.4380)"/>
<text class="value" x="603" y="151" text-anchor="end">3.50 s</text>
<text class="value" x="690" y="151" text-anchor="end">2.3×</text>
<text class="value" x="777" y="151" text-anchor="end">3.5 s</text>
<text class="value" x="864" y="151" text-anchor="end">1.4 GiB</text>
</g>
<g class="l2">
<text class="name" x="16" y="181">bun</text>
<rect class="track" x="90" y="169" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="169" width="410" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.4143)"/>
<text class="value" x="603" y="181" text-anchor="end">3.31 s</text>
<text class="value" x="690" y="181" text-anchor="end">2.4×</text>
<text class="value" x="777" y="181" text-anchor="end">3.3 s</text>
<text class="value" x="864" y="181" text-anchor="end">1.0 GiB</text>
</g>
<g class="l3">
<text class="name" x="16" y="211">tsc-rs</text>
<rect class="track" x="90" y="199" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="199" width="410" height="16" rx="4" fill="#e8743b" style="transform:scaleX(0.4043)"/>
<text class="value" x="603" y="211" text-anchor="end">3.23 s</text>
<text class="value" x="690" y="211" text-anchor="end">2.5×</text>
<text class="value" x="777" y="211" text-anchor="end">3.2 s</text>
<text class="value" x="864" y="211" text-anchor="end">1.3 GiB</text>
</g>
<g class="l4">
<text class="name" x="16" y="241">tsrs</text>
<rect class="track" x="90" y="229" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="229" width="410" height="16" rx="4" fill="#19a979" style="transform:scaleX(0.2703)"/>
<text class="value" x="603" y="241" text-anchor="end">2.16 s</text>
<text class="value" x="690" y="241" text-anchor="end">3.7×</text>
<text class="value" x="777" y="241" text-anchor="end">2.2 s</text>
<text class="value" x="864" y="241" text-anchor="end">0.6 GiB</text>
</g>
<text class="foot" x="16" y="278">Same diagnostics as tsgo, clean and with planted errors: tsc-ts, bun.</text>
<text class="foot" x="16" y="296">Different: tsc-rs +1 / −0 (matches its upstream build) · tsrs +1 / −0 (matches its upstream build).</text>
<text class="foot" x="16" y="314">Medians. "vs tsgo": tsgo's wall time divided by the checker's. CPU: user + system time across all threads. Peak memory: maximum resident set size.</text>
<text class="foot" x="16" y="332">+n / −m: diagnostics only in the checker / only in tsgo.</text>
</svg>
