<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Outline, single-threaded: wall time of one full type check</title>
<desc id="d">2,315 project files · tsgo creates 0.6 M types and 5.8 M instantiations. Cold full type check in real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs. tsgo 7.99 s (1.0×), tsc-ts 3.50 s (2.3×), bun 3.31 s (2.4×), tsc-rs 3.23 s (2.5×), tsrs 2.16 s (3.7×).</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.bg{fill:#ffffff;stroke:#d1d9e0}.track{fill:#eff2f5}
.title{font-size:16px;font-weight:600}.sub,.foot{font-size:12px;fill:#59636e}
.value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{transform-box:fill-box;transform-origin:left center}.bar,.value{animation-duration:10.49s;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes b0{0%{transform:scaleX(0)}76.17%,100%{transform:scaleX(1.0000)}}
@keyframes v0{0%,76.16%{opacity:0}76.17%,100%{opacity:1}}
.l0 .bar{animation-name:b0}.l0 .value{animation-name:v0}
@keyframes b1{0%{transform:scaleX(0)}33.37%,100%{transform:scaleX(0.4380)}}
@keyframes v1{0%,33.36%{opacity:0}33.37%,100%{opacity:1}}
.l1 .bar{animation-name:b1}.l1 .value{animation-name:v1}
@keyframes b2{0%{transform:scaleX(0)}31.55%,100%{transform:scaleX(0.4143)}}
@keyframes v2{0%,31.54%{opacity:0}31.55%,100%{opacity:1}}
.l2 .bar{animation-name:b2}.l2 .value{animation-name:v2}
@keyframes b3{0%{transform:scaleX(0)}30.79%,100%{transform:scaleX(0.4043)}}
@keyframes v3{0%,30.78%{opacity:0}30.79%,100%{opacity:1}}
.l3 .bar{animation-name:b3}.l3 .value{animation-name:v3}
@keyframes b4{0%{transform:scaleX(0)}20.59%,100%{transform:scaleX(0.2703)}}
@keyframes v4{0%,20.58%{opacity:0}20.59%,100%{opacity:1}}
.l4 .bar{animation-name:b4}.l4 .value{animation-name:v4}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#3d444d}.track{fill:#21262d}text{fill:#e6edf3}.sub,.foot{fill:#9198a1}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}
</style>
<rect class="bg" x="0.5" y="0.5" width="759" height="329" rx="6"/>
<text class="title" x="16" y="28">Outline, single-threaded</text>
<text class="sub" x="16" y="48">2,315 project files · tsgo creates 0.6 M types and 5.8 M instantiations</text>
<text class="sub" x="16" y="66">Cold full type check in real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs</text>
<text class="sub" x="576" y="90">median</text>
<text class="sub" x="744" y="90" text-anchor="end">vs tsgo</text>
<g class="l0">
<text class="name" x="16" y="121">tsgo</text>
<rect class="track" x="90" y="109" width="470" height="16" rx="4"/>
<rect class="bar" x="90" y="109" width="470" height="16" rx="4" fill="#8a8f98" style="transform:scaleX(1.0000)"/>
<text class="value" x="576" y="121">7.99 s</text>
<text class="value" x="744" y="121" text-anchor="end">1.0×</text>
</g>
<g class="l1">
<text class="name" x="16" y="151">tsc-ts</text>
<rect class="track" x="90" y="139" width="470" height="16" rx="4"/>
<rect class="bar" x="90" y="139" width="470" height="16" rx="4" fill="#3178c6" style="transform:scaleX(0.4380)"/>
<text class="value" x="576" y="151">3.50 s</text>
<text class="value" x="744" y="151" text-anchor="end">2.3×</text>
</g>
<g class="l2">
<text class="name" x="16" y="181">bun</text>
<rect class="track" x="90" y="169" width="470" height="16" rx="4"/>
<rect class="bar" x="90" y="169" width="470" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.4143)"/>
<text class="value" x="576" y="181">3.31 s</text>
<text class="value" x="744" y="181" text-anchor="end">2.4×</text>
</g>
<g class="l3">
<text class="name" x="16" y="211">tsc-rs</text>
<rect class="track" x="90" y="199" width="470" height="16" rx="4"/>
<rect class="bar" x="90" y="199" width="470" height="16" rx="4" fill="#e8743b" style="transform:scaleX(0.4043)"/>
<text class="value" x="576" y="211">3.23 s</text>
<text class="value" x="744" y="211" text-anchor="end">2.5×</text>
</g>
<g class="l4">
<text class="name" x="16" y="241">tsrs</text>
<rect class="track" x="90" y="229" width="470" height="16" rx="4"/>
<rect class="bar" x="90" y="229" width="470" height="16" rx="4" fill="#19a979" style="transform:scaleX(0.2703)"/>
<text class="value" x="576" y="241">2.16 s</text>
<text class="value" x="744" y="241" text-anchor="end">3.7×</text>
</g>
<text class="foot" x="16" y="278">Same diagnostics as tsgo, clean and with planted errors: tsc-ts, bun.</text>
<text class="foot" x="16" y="296">Different: tsc-rs +1 / −0 (same as tsgo-7.1-dev) · tsrs +1 / −0 (same as tsgo-7.1-dev).</text>
<text class="foot" x="16" y="314">"vs tsgo": tsgo's median divided by the checker's. +n / −m: diagnostics only in the checker / only in tsgo.</text>
</svg>
