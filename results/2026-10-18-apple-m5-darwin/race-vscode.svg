<text class="value" x="690" y="151" text-anchor="end">2.2×</text>
<text class="value" x="777" y="151" text-anchor="end">33.0 s</text>
<text class="value" x="864" y="151" text-anchor="end">6.9 GiB</text>
</g>
<g class="l2">
<text class="name" x="16" y="181">tsc-rs</text>
<rect class="track" x="90" y="169" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="169" width="410" height="16" rx="4" fill="#e8743b" style="transform:scaleX(0.4093)"/>
<text class="value" x="603" y="181" text-anchor="end">3.36 s</text>
<text class="value" x="690" y="181" text-anchor="end">2.4×</text>
<text class="value" x="777" y="181" text-anchor="end">13.8 s</text>
<text class="value" x="864" y="181" text-anchor="end">6.1 GiB</text>
</g>
<g class="l3">
<text class="name" x="16" y="211">bun</text>
<rect class="track" x="90" y="199" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="199" width="410" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.3082)"/>
<text class="value" x="603" y="211" text-anchor="end">2.53 s</text>
<text class="value" x="690" y="211" text-anchor="end">3.2×</text>
<text class="value" x="777" y="211" text-anchor="end">21.5 s</text>
<text class="value" x="864" y="211" text-anchor="end">2.2 GiB</text>
</g>
<g class="l4">
<text class="name" x="16" y="241">tsrs</text>
<rect class="track" x="90" y="229" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="229" width="410" height="16" rx="4" fill="#19a979" style="transform:scaleX(0.1754)"/>
<text class="value" x="603" y="241" text-anchor="end">1.44 s</text>
<text class="value" x="690" y="241" text-anchor="end">5.7×</text>
<text class="value" x="777" y="241" text-anchor="end">12.4 s</text>
<text class="value" x="864" y="241" text-anchor="end">2.3 GiB</text>
</g>
<text class="foot" x="16" y="278">Same diagnostics as tsgo, clean and with planted errors: tsc-ts, bun.</text>
<text class="foot" x="16" y="296">Different: tsc-rs +10 / −0 (matches its upstream build) · tsrs +10 / −0 (matches its upstream build).</text>
<text class="foot" x="16" y="314">Medians. "vs tsgo": tsgo's wall time divided by the checker's. CPU: user + system time across all threads. Peak memory: maximum resident set size.</text>
<text class="foot" x="16" y="332">+n / −m: diagnostics only in the checker / only in tsgo.</text>
</svg>
