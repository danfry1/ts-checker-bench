<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" width="880" height="348" role="img" aria-labelledby="t d">
<title id="t">VS Code, default threading: wall time of one full type check</title>
<desc id="d">10,645 project files · tsgo creates 3.3 M types and 4.2 M instantiations. Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs. tsgo: wall 8.21 s, vs tsgo 1.0×, CPU 41.6 s, peak memory 8.8 GiB; tsc-ts: wall 3.79 s, vs tsgo 2.2×, CPU 33.0 s, peak memory 6.9 GiB; tsc-rs: wall 3.36 s, vs tsgo 2.4×, CPU 13.8 s, peak memory 6.1 GiB; bun: wall 2.53 s, vs tsgo 3.2×, CPU 21.5 s, peak memory 2.2 GiB; tsrs: wall 1.44 s, vs tsgo 5.7×, CPU 12.4 s, peak memory 2.3 GiB.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.bg{fill:#ffffff;stroke:#d1d9e0}.track{fill:#eff2f5}
.title{font-size:16px;font-weight:600}.sub,.foot{font-size:12px;fill:#59636e}
.value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{transform-box:fill-box;transform-origin:left center}.bar,.value{animation-duration:10.71s;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes b0{0%{transform:scaleX(0)}76.66%,100%{transform:scaleX(1.0000)}}
@keyframes v0{0%,76.65%{opacity:0}76.66%,100%{opacity:1}}
.l0 .bar{animation-name:b0}.l0 .value{animation-name:v0}
@keyframes b1{0%{transform:scaleX(0)}35.39%,100%{transform:scaleX(0.4616)}}
@keyframes v1{0%,35.38%{opacity:0}35.39%,100%{opacity:1}}
.l1 .bar{animation-name:b1}.l1 .value{animation-name:v1}
@keyframes b2{0%{transform:scaleX(0)}31.37%,100%{transform:scaleX(0.4093)}}
@keyframes v2{0%,31.36%{opacity:0}31.37%,100%{opacity:1}}
.l2 .bar{animation-name:b2}.l2 .value{animation-name:v2}
@keyframes b3{0%{transform:scaleX(0)}23.62%,100%{transform:scaleX(0.3082)}}
@keyframes v3{0%,23.61%{opacity:0}23.62%,100%{opacity:1}}
.l3 .bar{animation-name:b3}.l3 .value{animation-name:v3}
@keyframes b4{0%{transform:scaleX(0)}13.45%,100%{transform:scaleX(0.1754)}}
@keyframes v4{0%,13.44%{opacity:0}13.45%,100%{opacity:1}}
.l4 .bar{animation-name:b4}.l4 .value{animation-name:v4}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#3d444d}.track{fill:#21262d}text{fill:#e6edf3}.sub,.foot{fill:#9198a1}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}
</style>
<rect class="bg" x="0.5" y="0.5" width="879" height="347" rx="6"/>
<text class="title" x="16" y="28">VS Code, default threading</text>
<text class="sub" x="16" y="48">10,645 project files · tsgo creates 3.3 M types and 4.2 M instantiations</text>
<text class="sub" x="16" y="66">Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs</text>
<text class="sub" x="603" y="90" text-anchor="end">wall</text>
<text class="sub" x="690" y="90" text-anchor="end">vs tsgo</text>
<text class="sub" x="777" y="90" text-anchor="end">CPU</text>
<text class="sub" x="864" y="90" text-anchor="end">peak memory</text>
<g class="l0">
<text class="name" x="16" y="121">tsgo</text>
<rect class="track" x="90" y="109" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="109" width="410" height="16" rx="4" fill="#8a8f98" style="transform:scaleX(1.0000)"/>
<text class="value" x="603" y="121" text-anchor="end">8.21 s</text>
