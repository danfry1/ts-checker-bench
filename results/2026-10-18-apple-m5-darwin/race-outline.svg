<rect class="track" x="90" y="169" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="169" width="410" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.2692)"/>
<text class="value" x="603" y="181" text-anchor="end">1.19 s</text>
<text class="value" x="690" y="181" text-anchor="end">3.7×</text>
<text class="value" x="777" y="181" text-anchor="end">8.9 s</text>
<text class="value" x="864" y="181" text-anchor="end">1.0 GiB</text>
</g>
<g class="l3">
<text class="name" x="16" y="211">tsc-ts</text>
<rect class="track" x="90" y="199" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="199" width="410" height="16" rx="4" fill="#3178c6" style="transform:scaleX(0.2647)"/>
<text class="value" x="603" y="211" text-anchor="end">1.17 s</text>
<text class="value" x="690" y="211" text-anchor="end">3.8×</text>
<text class="value" x="777" y="211" text-anchor="end">10.2 s</text>
<text class="value" x="864" y="211" text-anchor="end">2.3 GiB</text>
</g>
