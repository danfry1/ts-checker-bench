<rect class="track" x="90" y="229" width="410" height="16" rx="4"/>
<rect class="bar" x="90" y="229" width="410" height="16" rx="4" fill="#19a979" style="transform:scaleX(0.1833)"/>
<text class="value" x="603" y="241" text-anchor="end">0.81 s</text>
<text class="value" x="690" y="241" text-anchor="end">5.5×</text>
