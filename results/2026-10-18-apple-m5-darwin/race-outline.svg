<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" width="880" height="348" role="img" aria-labelledby="t d">
<title id="t">Outline, default threading: wall time of one full type check</title>
<desc id="d">2,315 project files · tsgo creates 0.6 M types and 5.8 M instantiations. Cold full type check in real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs. tsgo: wall 4.42 s, vs tsgo 1.0×, CPU 18.6 s, peak memory 3.2 GiB; tsc-rs: wall 1.84 s, vs tsgo 2.4×, CPU 5.4 s, peak memory 1.8 GiB; bun: wall 1.19 s, vs tsgo 3.7×, CPU 8.9 s, peak memory 1.0 GiB; tsc-ts: wall 1.17 s, vs tsgo 3.8×, CPU 10.2 s, peak memory 2.3 GiB; tsrs: wall 0.81 s, vs tsgo 5.5×, CPU 6.3 s, peak memory 1.0 GiB.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.bg{fill:#ffffff;stroke:#d1d9e0}.track{fill:#eff2f5}
.title{font-size:16px;font-weight:600}.sub,.foot{font-size:12px;fill:#59636e}
.value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{transform-box:fill-box;transform-origin:left center}.bar,.value{animation-duration:6.92s;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes b0{0%{transform:scaleX(0)}63.87%,100%{transform:scaleX(1.0000)}}
@keyframes v0{0%,63.86%{opacity:0}63.87%,100%{opacity:1}}
.l0 .bar{animation-name:b0}.l0 .value{animation-name:v0}
@keyframes b1{0%{transform:scaleX(0)}26.59%,100%{transform:scaleX(0.4163)}}
@keyframes v1{0%,26.58%{opacity:0}26.59%,100%{opacity:1}}
.l1 .bar{animation-name:b1}.l1 .value{animation-name:v1}
@keyframes b2{0%{transform:scaleX(0)}17.20%,100%{transform:scaleX(0.2692)}}
@keyframes v2{0%,17.19%{opacity:0}17.20%,100%{opacity:1}}
.l2 .bar{animation-name:b2}.l2 .value{animation-name:v2}
@keyframes b3{0%{transform:scaleX(0)}16.91%,100%{transform:scaleX(0.2647)}}
@keyframes v3{0%,16.90%{opacity:0}16.91%,100%{opacity:1}}
.l3 .bar{animation-name:b3}.l3 .value{animation-name:v3}
@keyframes b4{0%{transform:scaleX(0)}11.71%,100%{transform:scaleX(0.1833)}}
@keyframes v4{0%,11.70%{opacity:0}11.71%,100%{opacity:1}}
.l4 .bar{animation-name:b4}.l4 .value{animation-name:v4}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#3d444d}.track{fill:#21262d}text{fill:#e6edf3}.sub,.foot{fill:#9198a1}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}
</style>
<rect class="bg" x="0.5" y="0.5" width="879" height="347" rx="6"/>
<text class="title" x="16" y="28">Outline, default threading</text>
<text class="sub" x="16" y="48">2,315 project files · tsgo creates 0.6 M types and 5.8 M instantiations</text>
<text class="sub" x="16" y="66">Cold full type check in real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs</text>
<text class="sub" x="603" y="90" text-anchor="end">wall</text>
<text class="sub" x="690" y="90" text-anchor="end">vs tsgo</text>
<text class="sub" x="777" y="90" text-anchor="end">CPU</text>
<text class="sub" x="864" y="90" text-anchor="end">peak memory</text>
