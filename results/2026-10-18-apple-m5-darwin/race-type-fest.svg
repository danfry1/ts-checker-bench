<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 366" width="920" height="366" role="img" aria-labelledby="t d">
<title id="t">type-fest, default threading: wall time of one full type check</title>
<desc id="d">502 project files · tsgo creates 5.9 M types and 17.8 M instantiations. Shipped defaults, no thread flags: tsgo and tsc-rs 4 checkers; tsc-ts, tsrs and bun one per core (10). Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs. tsgo: wall time 7.44 s, vs tsgo 1.0×, CPU time 27.7 s, peak memory 8.2 GiB; tsc-rs: wall time 2.19 s, vs tsgo 3.4×, CPU time 4.5 s, peak memory 4.0 GiB; tsrs: wall time 1.70 s, vs tsgo 4.4×, CPU time 7.1 s, peak memory 1.8 GiB; tsc-ts: wall time 1.67 s, vs tsgo 4.5×, CPU time 10.9 s, peak memory 6.0 GiB; bun: wall time 1.37 s, vs tsgo 5.4×, CPU time 5.6 s, peak memory 1.4 GiB.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;fill:#1f2328}
.bg{fill:#ffffff;stroke:#d1d9e0}.track{fill:#eff2f5}
.title{font-size:16px;font-weight:600}.sub,.foot{font-size:12px;fill:#59636e}
.value{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.bar{transform-box:fill-box;transform-origin:left center}.bar,.value{animation-duration:9.94s;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes b0{0%{transform:scaleX(0)}74.85%,100%{transform:scaleX(1.0000)}}
@keyframes v0{0%,74.84%{opacity:0}74.85%,100%{opacity:1}}
.l0 .bar{animation-name:b0}.l0 .value{animation-name:v0}
@keyframes b1{0%{transform:scaleX(0)}22.03%,100%{transform:scaleX(0.2944)}}
@keyframes v1{0%,22.02%{opacity:0}22.03%,100%{opacity:1}}
.l1 .bar{animation-name:b1}.l1 .value{animation-name:v1}
@keyframes b2{0%{transform:scaleX(0)}17.10%,100%{transform:scaleX(0.2285)}}
@keyframes v2{0%,17.09%{opacity:0}17.10%,100%{opacity:1}}
.l2 .bar{animation-name:b2}.l2 .value{animation-name:v2}
@keyframes b3{0%{transform:scaleX(0)}16.80%,100%{transform:scaleX(0.2245)}}
@keyframes v3{0%,16.79%{opacity:0}16.80%,100%{opacity:1}}
.l3 .bar{animation-name:b3}.l3 .value{animation-name:v3}
@keyframes b4{0%{transform:scaleX(0)}13.78%,100%{transform:scaleX(0.1841)}}
@keyframes v4{0%,13.77%{opacity:0}13.78%,100%{opacity:1}}
.l4 .bar{animation-name:b4}.l4 .value{animation-name:v4}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#3d444d}.track{fill:#21262d}text{fill:#e6edf3}.sub,.foot{fill:#9198a1}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}
</style>
<rect class="bg" x="0.5" y="0.5" width="919" height="365" rx="6"/>
<text class="title" x="16" y="28">type-fest, default threading</text>
<text class="sub" x="16" y="48">502 project files · tsgo creates 5.9 M types and 17.8 M instantiations</text>
<text class="sub" x="16" y="66">Shipped defaults, no thread flags: tsgo and tsc-rs 4 checkers; tsc-ts, tsrs and bun one per core (10)</text>
<text class="sub" x="16" y="84">Fresh process, no incremental cache · real time · Apple M5, macOS 26.5.1 (25F80) · median of 7 runs</text>
<text class="sub" x="591" y="108" text-anchor="end">wall time</text>
<text class="sub" x="695" y="108" text-anchor="end">vs tsgo</text>
<text class="sub" x="800" y="108" text-anchor="end">CPU time</text>
<text class="sub" x="904" y="108" text-anchor="end">peak memory</text>
<g class="l0">
<text class="name" x="16" y="139">tsgo</text>
<rect class="track" x="90" y="127" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="127" width="380" height="16" rx="4" fill="#8a8f98" style="transform:scaleX(1.0000)"/>
<text class="value" x="591" y="139" text-anchor="end">7.44 s</text>
<text class="value" x="695" y="139" text-anchor="end">1.0×</text>
<text class="value" x="800" y="139" text-anchor="end">27.7 s</text>
<text class="value" x="904" y="139" text-anchor="end">8.2 GiB</text>
</g>
<g class="l1">
<text class="name" x="16" y="169">tsc-rs</text>
<rect class="track" x="90" y="157" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="157" width="380" height="16" rx="4" fill="#e8743b" style="transform:scaleX(0.2944)"/>
<text class="value" x="591" y="169" text-anchor="end">2.19 s</text>
<text class="value" x="695" y="169" text-anchor="end">3.4×</text>
<text class="value" x="800" y="169" text-anchor="end">4.5 s</text>
<text class="value" x="904" y="169" text-anchor="end">4.0 GiB</text>
</g>
<g class="l2">
<text class="name" x="16" y="199">tsrs</text>
<rect class="track" x="90" y="187" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="187" width="380" height="16" rx="4" fill="#19a979" style="transform:scaleX(0.2285)"/>
<text class="value" x="591" y="199" text-anchor="end">1.70 s</text>
<text class="value" x="695" y="199" text-anchor="end">4.4×</text>
<text class="value" x="800" y="199" text-anchor="end">7.1 s</text>
<text class="value" x="904" y="199" text-anchor="end">1.8 GiB</text>
</g>
<g class="l3">
<text class="name" x="16" y="229">tsc-ts</text>
<rect class="track" x="90" y="217" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="217" width="380" height="16" rx="4" fill="#3178c6" style="transform:scaleX(0.2245)"/>
<text class="value" x="591" y="229" text-anchor="end">1.67 s</text>
<text class="value" x="695" y="229" text-anchor="end">4.5×</text>
<text class="value" x="800" y="229" text-anchor="end">10.9 s</text>
<text class="value" x="904" y="229" text-anchor="end">6.0 GiB</text>
</g>
<g class="l4">
<text class="name" x="16" y="259">bun</text>
<rect class="track" x="90" y="247" width="380" height="16" rx="4"/>
<rect class="bar" x="90" y="247" width="380" height="16" rx="4" fill="#c94fb6" style="transform:scaleX(0.1841)"/>
<text class="value" x="591" y="259" text-anchor="end">1.37 s</text>
<text class="value" x="695" y="259" text-anchor="end">5.4×</text>
<text class="value" x="800" y="259" text-anchor="end">5.6 s</text>
<text class="value" x="904" y="259" text-anchor="end">1.4 GiB</text>
</g>
<text class="foot" x="16" y="296">Same diagnostics as tsgo, clean and with planted errors: tsc-ts, bun.</text>
<text class="foot" x="16" y="314">Different: tsc-rs with planted errors +1 / −1 (matches its upstream build) · tsrs with planted errors +1 / −1 (matches its upstream build).</text>
<text class="foot" x="16" y="332">Medians. "vs tsgo": tsgo's wall time divided by the checker's. CPU time: user + system, across all threads. Peak memory: maximum resident set size.</text>
<text class="foot" x="16" y="350">+n / −m: diagnostics only in the checker / only in tsgo.</text>
</svg>
